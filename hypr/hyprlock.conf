general {
    # hide_cursor             = true
    immediate_render        = true
}

background {
    monitor        =
    path           = screenshot
    brightness     = 0.0
    contrast       = 0.92
    blur_passes    = 2
    blur_size      = 5
    noise          = 0.025
    vibrancy       = 0.0
    vibrancy_darkness = 0.0
}

#clock
label {
    monitor      =
    text         = cmd[update:1000] date +"%H:%M"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 92
    color        = rgba(c5c5c5bb)
    shadow_passes = 1
    shadow_size   = 3
    shadow_boost  = 0.3
    shadow_color  = rgba(00000099)
    position     = 0, 140
    halign       = center
    valign       = center
}

label {
    monitor      =
    text         = cmd[update:30000] date +"%a, %d %b %Y"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 22
    color        = rgba(8a8a8a99)
    shadow_passes = 1
    shadow_size   = 2
    shadow_boost  = 0.25
    shadow_color  = rgba(00000088)
    position     = 0, 60
    halign       = center
    valign       = center
}

input-field {
    monitor             =
    size                = 280, 54
    position            = 0, -180
    halign              = center
    valign              = center
    font_family         = JetBrainsMono Nerd Font
    font_color          = rgba(d0d0d0dd)
    outer_color         = rgba(3a3a3acc)
    inner_color         = rgba(161616d0)
    check_color         = rgba(88bb88cc)
    fail_color          = rgba(bb5555cc)
    rounding            = 12
    outline_thickness   = 2
    placeholder_text    = AwAwa...
    hide_input          = false
    fade_on_empty       = false
    dots_center         = true
    dots_spacing        = 0.22
    dots_rounding       = 999
    fail_text           = error ($ATTEMPTS)
}
layerrule = abovelock true, wvkbd

label {
    monitor =
    text = 󰌌　
    color = rgba(ffffffdd)
    font_size = 28
    halign = left
    valign = top
    position = 64, 0


    onclick = pkill wvkbd-deskintl || wvkbd-deskintl
}
