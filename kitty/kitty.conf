# =========================
# FONT
# =========================
# font_family              JetBrainsMono Nerd Font Mono
# bold_font                JetBrainsMono Nerd Font Mono Bold
# italic_font              JetBrainsMono Nerd Font Mono Italic
# bold_italic_font         JetBrainsMono Nerd Font Mono Bold Italic
font_size        13
disable_ligatures never

# =========================
# CURSOR
# =========================
cursor            #ffffff
cursor_shape      beam
cursor_blink_interval 0.5

# =========================
# SCROLLBACK
# =========================
scrollback_lines  10000
wheel_scroll_multiplier 5.0

# =========================
# WINDOW
# =========================
background_opacity 0.8
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no

# =========================
# COLORS — ARCH LINUX + HYPRLAND THEME
# =========================
background #0a0f14
foreground #d9e0ee
selection_background #a6e3ff
selection_foreground #081018

color0  #11161d
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #1793d1
color5  #cba6f7
color6  #89dceb
color7  #d9e0ee

color8  #586274
color9  #ff9bb5
color10 #b7f0b1
color11 #ffe6a8
color12 #4fb4ff
color13 #d8b4fe
color14 #94e2ff
color15 #ffffff

# =========================
# TAB BAR
# =========================
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #081018
active_tab_background   #89dceb
inactive_tab_foreground #9aa7b5
inactive_tab_background #121922

# =========================
# KEYBINDS (PRAKTYCZNE)
# =========================
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+enter new_window
map ctrl+shift+q close_window
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
